name: 编译Hi3798mv100的ubuntu系统USB刷机包

on:
  workflow_dispatch:
    inputs:
      device_model:
        description: '设备型号（如 mdmo1f）'
        required: false
        default: 'mdmo1f'
      usb_url:
        description: '原始 USB 刷机包下载地址（不填则根据 device_model 自动拼接）'
        required: false
      base_version:
        description: 'Ubuntu Base 版本号（如 20.04.5 / 22.04.5）'
        required: false
        default: '20.04.5'
      base_url:
        description: 'Ubuntu Base 下载目录'
        required: false
        default: 'https://cdimage.ubuntu.com/ubuntu-base/releases/20.04/release'
      mirror:
        description: 'apt 软件源镜像'
        required: false
        default: 'http://repo.huaweicloud.com/ubuntu-ports'
      root_password:
        description: 'root 登录密码（生产环境务必修改）'
        required: false
        default: 'root123'
      partition_size_mb:
        description: 'fastboot 写入的分区大小（MB），默认 512，与设备日志 count 1048576 对应'
        required: false
        default: '512'
  push:
    branches: [ main ]
    paths:
      - 'build_rootfs.sh'
      - 'build_usb_rootfs.sh'
      - 'lib/**'
      - '.github/workflows/**'

concurrency:
  group: build-usb-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-usb-pure:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    env:
      DEVICE_MODEL: ${{ inputs.device_model || 'mdmo1f' }}
      USB_URL: ${{ inputs.usb_url || format('https://node4.histb.com:9088/update/system/mv100-{0}-usb-flash.zip', inputs.device_model || 'mdmo1f') }}
      UBUNTU_VERSION: ${{ inputs.base_version || '20.04.5' }}
      BASE_URL: ${{ inputs.base_url || 'https://cdimage.ubuntu.com/ubuntu-base/releases/20.04/release' }}
      MIRROR: ${{ inputs.mirror || 'http://repo.huaweicloud.com/ubuntu-ports' }}
      ROOT_PASSWORD: ${{ inputs.root_password || 'root123' }}
      PARTITION_SIZE_MB: ${{ inputs.partition_size_mb || '512' }}

    steps:
    - name: 1. 检出代码
      uses: actions/checkout@v4

    - name: 2. 下载原始 USB 刷机包
      run: |
        wget --no-check-certificate -c --tries=5 --timeout=60 --waitretry=10 "$USB_URL" -O original_usb.zip
        ls -lh original_usb.zip
        unzip -tq original_usb.zip >/dev/null || { echo "❌ 原始包损坏"; exit 1; }
        echo "✅ 原始包完整性 OK"

    - name: 3. 解压并检测原始镜像格式与真实 ext4 大小
      run: |
        rm -rf usb_template
        mkdir -p usb_template
        unzip -q original_usb.zip -d usb_template/
        ls -la usb_template/mv100/
        test -f "usb_template/mv100/www_ecoo_top.ext4" && echo "✅ 找到 www_ecoo_top.ext4" || { echo "❌ 未找到 www_ecoo_top.ext4"; exit 1; }

        cp "usb_template/mv100/www_ecoo_top.ext4" original_system.ext4
        ls -lh original_system.ext4

        MAGIC=$(xxd -p -l 4 original_system.ext4)
        echo "原始镜像 magic: $MAGIC"

        if [ "$MAGIC" = "3aff26ed" ]; then
          echo "ℹ️ 原始镜像 = Android sparse 格式"
          echo "ORIG_FORMAT=sparse" >> "$GITHUB_ENV"
          # 解析 sparse 头：offset 12 = blk_sz(4B)，offset 16 = total_blks(4B)，小端
          BLK_SZ=$(od -An -tu4 -j12 -N4 original_system.ext4 | tr -d ' ')
          TOTAL_BLKS=$(od -An -tu4 -j16 -N4 original_system.ext4 | tr -d ' ')
          ORIG_FS_SIZE=$((BLK_SZ * TOTAL_BLKS))
          echo "  sparse 头: blk_sz=$BLK_SZ  total_blks=$TOTAL_BLKS"
          echo "  解压后 ext4 大小: $ORIG_FS_SIZE 字节 ($((ORIG_FS_SIZE/1024/1024)) MB)"
        else
          echo "ℹ️ 原始镜像 = 普通 ext4 格式"
          echo "ORIG_FORMAT=ext4" >> "$GITHUB_ENV"
          ORIG_FS_SIZE=$(stat -c%s original_system.ext4)
          echo "  原始 ext4 大小: $ORIG_FS_SIZE 字节 ($((ORIG_FS_SIZE/1024/1024)) MB)"
        fi

        # ========== 关键修复 ==========
        # fastboot 的 "MMC write ext4 sparse" 要求：
        #   解压后 ext4 镜像大小 == fastboot 写入大小（设备日志 count 1048576 × 512B = 512MB）
        # 如果原始 ext4 小于写入大小，必须扩展到写入大小，否则报
        #   "error: partition size 512 MB != ext4 image size 281 MB"
        MIN_SIZE=$((PARTITION_SIZE_MB * 1024 * 1024))
        echo "fastboot 写入大小下限: $MIN_SIZE 字节 (${PARTITION_SIZE_MB} MB)"

        if [ "$ORIG_FS_SIZE" -ge "$MIN_SIZE" ]; then
          TARGET_SIZE=$ORIG_FS_SIZE
          echo "✅ 原始 ext4 已足够大，使用原始大小: $TARGET_SIZE"
        else
          TARGET_SIZE=$MIN_SIZE
          echo "⚠️  原始 ext4 ($ORIG_FS_SIZE) < 写入大小 ($MIN_SIZE)，扩展到 $TARGET_SIZE"
          echo "   （首次启动时 resize2fs 会自动扩展到整个 ubuntu 分区）"
        fi
        echo "TARGET_SIZE=$TARGET_SIZE" >> "$GITHUB_ENV"

    - name: 4. 安装依赖
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq qemu-user-static e2fsprogs zip android-sdk-libsparse-utils
        which img2simg simg2img

    - name: 5. 缓存 Ubuntu Base 镜像
      uses: actions/cache@v4
      with:
        path: cache/ubuntu-base-*.tar.gz
        key: ubuntu-base-${{ env.UBUNTU_VERSION }}

    - name: 6. 构建纯净根文件系统
      run: |
        chmod +x build_usb_rootfs.sh
        ./build_usb_rootfs.sh

    - name: 7. 创建 512MB 级 ext4 镜像并转为 sparse
      run: |
        PURE_IMG="usb-rootfs-pure.ext4"
        rm -f "$PURE_IMG"
        echo "创建目标大小: $TARGET_SIZE 字节 ($((TARGET_SIZE/1024/1024)) MB)"

        # 用目标大小创建镜像（关键：不是原始文件大小）
        dd if=/dev/zero of="$PURE_IMG" bs=1M count=$((TARGET_SIZE/1024/1024)) status=progress
        # 若 TARGET_SIZE 不是整数 MB，补足剩余字节
        ACTUAL_SIZE=$(stat -c%s "$PURE_IMG")
        if [ "$ACTUAL_SIZE" -lt "$TARGET_SIZE" ]; then
          dd if=/dev/zero of="$PURE_IMG" bs=1 count=0 seek=$TARGET_SIZE
        fi
        ls -lh "$PURE_IMG"

        mkfs.ext4 -F -m 0 -L "pure_root" "$PURE_IMG"

        mkdir -p temp_mount
        sudo mount -o loop "$PURE_IMG" temp_mount
        sudo cp -a usb_pure_rootfs/. temp_mount/
        sync
        sudo umount temp_mount
        e2fsck -p -f "$PURE_IMG" || true

        # 校验：镜像文件大小必须 == TARGET_SIZE
        FINAL_SIZE=$(stat -c%s "$PURE_IMG")
        echo "ext4 镜像最终大小: $FINAL_SIZE 字节"
        if [ "$FINAL_SIZE" != "$TARGET_SIZE" ]; then
          echo "❌ 镜像大小 ($FINAL_SIZE) 与目标 ($TARGET_SIZE) 不一致"
          exit 1
        fi

        # 按原始格式输出
        if [ "$ORIG_FORMAT" = "sparse" ]; then
          img2simg "$PURE_IMG" "usb-rootfs-pure-final.img"
          echo "✅ 已转为 Android sparse 格式"
          # 校验 sparse 头中的 total size
          SP_BLK_SZ=$(od -An -tu4 -j12 -N4 usb-rootfs-pure-final.img | tr -d ' ')
          SP_TOTAL_BLKS=$(od -An -tu4 -j16 -N4 usb-rootfs-pure-final.img | tr -d ' ')
          SP_TOTAL_SIZE=$((SP_BLK_SZ * SP_TOTAL_BLKS))
          echo "  sparse 头: blk_sz=$SP_BLK_SZ total_blks=$SP_TOTAL_BLKS => $SP_TOTAL_SIZE 字节"
          if [ "$SP_TOTAL_SIZE" != "$TARGET_SIZE" ]; then
            echo "❌ sparse 解压后大小 ($SP_TOTAL_SIZE) != 目标 ($TARGET_SIZE)"
            exit 1
          fi
        else
          cp "$PURE_IMG" "usb-rootfs-pure-final.img"
          echo "ℹ️ 保持普通 ext4 格式"
        fi

        echo "输出镜像 magic:"
        xxd -l 4 "usb-rootfs-pure-final.img"
        ls -lh "usb-rootfs-pure-final.img"

    - name: 8. 替换并重新打包
      run: |
        SOURCE_OS="Ubuntu_${{ env.UBUNTU_VERSION }}"
        FINAL_DIR="USB-hi3798mv100-${{ env.DEVICE_MODEL }}-PURE"
        rm -rf "$FINAL_DIR"
        cp -r usb_template "$FINAL_DIR"
        rm -f "$FINAL_DIR/mv100/www_ecoo_top.ext4"
        cp usb-rootfs-pure-final.img "$FINAL_DIR/mv100/www_ecoo_top.ext4"

        echo "刷机包内容:"
        ls -l "$FINAL_DIR/mv100/"

        INNER_ZIP="USB-hi3798mv100-${{ env.DEVICE_MODEL }}-PURE-${SOURCE_OS}-$(date +%Y%m%d).zip"
        cd "$FINAL_DIR"
        zip -q -r "../${INNER_ZIP}" .
        cd ..
        echo "INNER_ZIP=${INNER_ZIP}" >> "$GITHUB_ENV"
        echo "SOURCE_OS=${SOURCE_OS}" >> "$GITHUB_ENV"
        ls -lh "${INNER_ZIP}"

    - name: 9. 打包总包（含说明文档）
      run: |
        RELEASE_ZIP="Hi3798mv100_USB_${{ env.DEVICE_MODEL }}_${SOURCE_OS}.zip"
        mkdir -p release_staging
        cp "${INNER_ZIP}" "release_staging/"
        cp usb-rootfs-pure-final.img "release_staging/www_ecoo_top.ext4"

        cat > "release_staging/刷机包说明.txt" << EOF
        ================================================================
          Hi3798MV100 USB 纯净刷机包 — 使用说明
        ================================================================
        【构建信息】
          设备型号：      ${{ env.DEVICE_MODEL }}
          编译源系统：    Ubuntu ${{ env.UBUNTU_VERSION }}
          镜像格式：      ${ORIG_FORMAT}
          镜像目标大小：  ${TARGET_SIZE} 字节 ($((TARGET_SIZE/1024/1024)) MB)
          构建日期：      $(date '+%Y-%m-%d %H:%M:%S')

        【root 账号】
          用户名：root    初始密码：${{ env.ROOT_PASSWORD }}
          ⚠️ 首次登录后请立即执行 passwd root 修改密码！

        【刷机步骤】
          1. 将刷机包 zip 解压到 U 盘根目录（FAT32）
          2. U 盘插入机顶盒 USB 口
          3. 按住 Recovery 按钮通电，等待自动刷机
          4. 自动重启，首次启动较慢请耐心等待

        【故障排查】
          - "Invalid sparse format"：镜像不是 sparse 格式
          - "partition size X != ext4 image size Y"：ext4 大小与 fastboot 写入大小不一致
        ================================================================
        EOF
        sed -i 's/^        //' "release_staging/刷机包说明.txt"

        cd release_staging
        zip -q -r "../${RELEASE_ZIP}" .
        cd ..
        echo "RELEASE_ZIP=${RELEASE_ZIP}" >> "$GITHUB_ENV"
        ls -lh "${RELEASE_ZIP}"

    - name: 10. 上传 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Hi3798mv100_USB_${{ env.DEVICE_MODEL }}_${{ env.SOURCE_OS }}
        path: |
          Hi3798mv100_USB_${{ env.DEVICE_MODEL }}_${{ env.SOURCE_OS }}.zip
        retention-days: 7
        if-no-files-found: error

    - name: 11. 上传到 GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ github.run_number }}-${{ env.DEVICE_MODEL }}
        name: "Hi3798MV100 USB 纯净刷机包 - ${{ env.DEVICE_MODEL }} (${{ env.SOURCE_OS }})"
        body: |
          ## Hi3798MV100 USB 纯净刷机包
          - 设备型号：`${{ env.DEVICE_MODEL }}`
          - 编译源系统：`Ubuntu ${{ env.UBUNTU_VERSION }}`
          - 镜像格式：`${{ env.ORIG_FORMAT }}`
          - 镜像大小：`${{ env.TARGET_SIZE }}` 字节
          - root 初始密码：`${{ env.ROOT_PASSWORD }}`
        files: |
          Hi3798mv100_USB_${{ env.DEVICE_MODEL }}_${{ env.SOURCE_OS }}.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: 12. 清理
      if: always()
      run: |
        sudo rm -rf usb_pure_rootfs temp_mount usb_template USB-hi3798mv100-${{ env.DEVICE_MODEL }}-PURE release_staging 2>/dev/null || true
        rm -f original_usb.zip original_system.ext4 usb-rootfs-pure*.img usb-rootfs-pure-final.img 2>/dev/null || true
        echo "✅ 清理完成。"
