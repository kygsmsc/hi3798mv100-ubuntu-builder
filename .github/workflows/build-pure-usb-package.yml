name: 编译Hi3798mv100的ubuntu系统USB刷机包

on:
  workflow_dispatch:
    inputs:
      device_model:
        description: '设备型号（如 mdmo1f）'
        required: false
        default: 'mdmo1f'
      usb_url:
        description: '原始 USB 刷机包下载地址（不填则根据 device_model 自动拼接）'
        required: false
      base_version:
        description: 'Ubuntu Base 版本号（如 20.04.5 / 22.04.5）'
        required: false
        default: '20.04.5'
      base_url:
        description: 'Ubuntu Base 下载目录'
        required: false
        default: 'https://cdimage.ubuntu.com/ubuntu-base/releases/20.04/release'
      mirror:
        description: 'apt 软件源镜像'
        required: false
        default: 'http://repo.huaweicloud.com/ubuntu-ports'
      root_password:
        description: 'root 登录密码（生产环境务必修改）'
        required: false
        default: 'root123'
      p9_size_mb:
        description: 'p9 rootfs ext4 初始大小（MB）。原厂约 828MB，默认 1024MB 留冗余'
        required: false
        default: '1024'
      custom_mac:
        description: '自定义 eth0 MAC（留空则用设备原生。多设备场景每台设不同值）'
        required: false
        default: ''
  push:
    branches: [ main ]
    paths:
      - 'build_rootfs.sh'
      - 'build_usb_rootfs.sh'
      - 'lib/**'
      - '.github/workflows/**'

concurrency:
  group: build-usb-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-usb-pure:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    env:
      DEVICE_MODEL: ${{ inputs.device_model || 'mdmo1f' }}
      USB_URL: ${{ inputs.usb_url || format('https://node4.histb.com:9088/update/system/mv100-{0}-usb-flash.zip', inputs.device_model || 'mdmo1f') }}
      UBUNTU_VERSION: ${{ inputs.base_version || '20.04.5' }}
      BASE_URL: ${{ inputs.base_url || 'https://cdimage.ubuntu.com/ubuntu-base/releases/20.04/release' }}
      MIRROR: ${{ inputs.mirror || 'http://repo.huaweicloud.com/ubuntu-ports' }}
      ROOT_PASSWORD: ${{ inputs.root_password || 'root123' }}
      P9_SIZE_MB: ${{ inputs.p9_size_mb || '1024' }}
      CUSTOM_MAC: ${{ inputs.custom_mac || '' }}

    steps:
    - name: 1. 检出代码
      uses: actions/checkout@v4

    - name: 2. 下载原始 USB 刷机包
      run: |
        wget --no-check-certificate -c --tries=5 --timeout=60 --waitretry=10 "$USB_URL" -O original_usb.zip
        ls -lh original_usb.zip
        unzip -tq original_usb.zip >/dev/null || { echo "❌ 原始包损坏"; exit 1; }
        echo "✅ 原始包完整性 OK"

    - name: 3. 解压、验证必备文件、读取原厂 p8 sparse 头（不解压内容）
      run: |
        rm -rf usb_template
        mkdir -p usb_template
        unzip -q original_usb.zip -d usb_template/
        ls -la usb_template/
        ls -la usb_template/mv100/

        echo "========== 原厂包完整文件清单 =========="
        find usb_template -type f | sort
        echo "========================================="

        # 验证 fastboot 必备文件
        REQUIRED=(
          "bootargs.bin"
          "fastboot.bin"
          "mv100/baseparam.img"
          "mv100/bootargs.bin"
          "mv100/fastboot.bin"
          "mv100/hi_kernel.bin"
          "mv100/logo.img"
          "mv100/pq_param.bin"
          "mv100/recoverybox32.ext4"
          "mv100/www_ecoo_top.ext4"
        )
        MISSING=""
        for f in "${REQUIRED[@]}"; do
          [ -f "usb_template/$f" ] || MISSING="$MISSING\n  - $f"
        done
        if [ -n "$MISSING" ]; then
          echo -e "❌ 原厂包缺少 fastboot 必需文件:$MISSING"
          exit 1
        fi
        echo "✅ 原厂包必备文件齐全"

        # ========== 关键：只读 sparse 头，不解压、不挂载、不读内容 ==========
        # 这是路径A唯一的动作：读 20 字节计算 P8_SIZE
        cp "usb_template/mv100/www_ecoo_top.ext4" original_p8.sparse
        MAGIC=$(xxd -p -l 4 original_p8.sparse)
        echo "原厂 p8 magic: $MAGIC"
        if [ "$MAGIC" != "3aff26ed" ]; then
          echo "❌ 原厂 www_ecoo_top.ext4 不是 sparse 格式（magic=$MAGIC）"
          exit 1
        fi
        BLK_SZ=$(od -An -tu4 -j12 -N4 original_p8.sparse | tr -d ' ')
        TOTAL_BLKS=$(od -An -tu4 -j16 -N4 original_p8.sparse | tr -d ' ')
        P8_SIZE=$((BLK_SZ * TOTAL_BLKS))
        echo "原厂 p8 raw 大小: $P8_SIZE 字节 ($((P8_SIZE/1024/1024)) MB)"
        echo "P8_SIZE=$P8_SIZE" >> "$GITHUB_ENV"

        # 明确声明：原厂 p8 内容未解压、未挂载、未复制
        echo ""
        echo "⚠️  后续流程将【完全不碰】原厂 www_ecoo_top.ext4 的实际内容"
        echo "   - 不 simg2img"
        echo "   - 不挂载"
        echo "   - 不解压 backup-32.gz"
        echo "   - 不复制任何文件"
        echo "   本步骤到此结束"

    - name: 4. 安装依赖
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq qemu-user-static e2fsprogs zip android-sdk-libsparse-utils
        which img2simg

    - name: 5. 缓存 Ubuntu Base 镜像
      uses: actions/cache@v4
      with:
        path: cache/ubuntu-base-*.tar.gz
        key: ubuntu-base-${{ env.UBUNTU_VERSION }}

    - name: 6. 构建纯净根文件系统（只从 Ubuntu Base 解压 + chroot 配置）
      run: |
        chmod +x build_usb_rootfs.sh
        ./build_usb_rootfs.sh
        echo ""
        echo "========== 构建完成后的 usb_pure_rootfs /root/ =========="
        sudo ls -la usb_pure_rootfs/root/

    - name: 7. 构建 p9 → backup-32.gz → p8（全程审计，每步验证无杂质）
      run: |
        # ========== 前置：rootfs 放得下吗 ==========
        ROOTFS_MB=$(sudo du -sm usb_pure_rootfs | cut -f1)
        echo "rootfs 实际大小: ${ROOTFS_MB} MB"
        if [ "$ROOTFS_MB" -gt $((P9_SIZE_MB * 90 / 100)) ]; then
          echo "❌ rootfs (${ROOTFS_MB}MB) 超过 p9 ext4 的 90%"
          exit 1
        fi

        # ========== 步骤7.1：创建 p9 rootfs ext4（只拷贝 usb_pure_rootfs）==========
        P9_IMG="p9-rootfs.img"
        rm -f "$P9_IMG"
        echo ""
        echo "===== 7.1 创建 p9 rootfs ext4 (${P9_SIZE_MB} MB) ====="
        dd if=/dev/zero of="$P9_IMG" bs=1M count="$P9_SIZE_MB" status=progress
        mkfs.ext4 -F -m 0 -L "rootfs" "$P9_IMG"

        mkdir -p mnt_p9
        sudo mount -o loop "$P9_IMG" mnt_p9

        # 【唯一拷贝动作】只从 usb_pure_rootfs/ 拷贝，路径B 与路径A 完全隔离
        echo ">>> 拷贝源：usb_pure_rootfs/（我们构建的纯净 rootfs）"
        sudo cp -a usb_pure_rootfs/. mnt_p9/
        sync

        # ============================================================
        # 【审计 1】新 p9 /root/ 必须只有标准文件
        # ============================================================
        echo ""
        echo "========== 审计1：新 p9 /root/ 内容 =========="
        sudo ls -la mnt_p9/root/ | awk 'NR>1 {print $1, $3, $4, $9, $10, $11}'
        BAD_P9_ROOT=$(sudo find mnt_p9/root -mindepth 1 -maxdepth 1 \
            ! -name '.bashrc' ! -name '.profile' ! -name '.bash_logout' \
            ! -name '.cache' ! -name '.local' 2>/dev/null)
        if [ -n "$BAD_P9_ROOT" ]; then
          echo "❌ 新 p9 /root/ 下有非标准文件:"
          echo "$BAD_P9_ROOT"
          echo "   构建流程出现污染！"
          sudo umount mnt_p9
          exit 1
        fi
        echo "✅ 审计1通过：新 p9 /root/ 只有 .bashrc/.profile/.cache/.local 等标准文件"

        # ============================================================
        # 【审计 2】新 p9 /tmp 和 /home 必须为空
        # ============================================================
        echo ""
        echo "========== 审计2：新 p9 /tmp 和 /home 为空 =========="
        TMP_COUNT=$(sudo find mnt_p9/tmp -mindepth 1 2>/dev/null | wc -l)
        HOME_COUNT=$(sudo find mnt_p9/home -mindepth 1 2>/dev/null | wc -l)
        echo "/tmp 条目数: $TMP_COUNT"
        echo "/home 条目数: $HOME_COUNT"
        if [ "$TMP_COUNT" -ne 0 ] || [ "$HOME_COUNT" -ne 0 ]; then
          echo "❌ 新 p9 /tmp 或 /home 非空"
          sudo ls -la mnt_p9/tmp/
          sudo ls -la mnt_p9/home/
          sudo umount mnt_p9
          exit 1
        fi
        echo "✅ 审计2通过：/tmp 和 /home 干净"

        # ============================================================
        # 【审计 3】全盘搜可疑文件名（zip/ext4/img/诊断脚本/构建中间产物）
        # ============================================================
        echo ""
        echo "========== 审计3：新 p9 全盘可疑文件搜索 =========="
        SUSPECT=$(sudo find mnt_p9 -type f \
            \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.tar.xz' \
               -o -name '*.ext4' -o -name '*.img' -o -name '*.sparse' \
               -o -name 'backup-32*' -o -name 'sdat2img*' -o -name 'simg2img*' \
               -o -name 'sparse_info*' -o -name 'www_raw*' -o -name 'qemu-arm*' \
               -o -name 'rootfs_inner*' -o -name 'mv100*' -o -name 'TTL-*' \) \
            2>/dev/null)
        if [ -n "$SUSPECT" ]; then
          echo "❌ 新 p9 内发现可疑文件:"
          echo "$SUSPECT"
          sudo umount mnt_p9
          exit 1
        fi
        echo "✅ 审计3通过：新 p9 全盘无任何可疑文件"

        # ============================================================
        # 【审计 4】非白名单顶层目录审计（防止误拷 rootfs 外的目录）
        # ============================================================
        echo ""
        echo "========== 审计4：新 p9 顶层目录列表 =========="
        sudo ls -la mnt_p9/ | awk 'NR>1 {print $1, $3, $4, $9}'

        sudo umount mnt_p9
        e2fsck -p -f "$P9_IMG" || true
        echo "p9 rootfs: $(stat -c%s "$P9_IMG") 字节"
        echo "✅ 7.1 完成：新 p9 已生成，通过全部 4 项审计"

        # ========== 步骤7.2：gzip -9 压缩为 backup-32.gz ==========
        echo ""
        echo "===== 7.2 压缩为 backup-32.gz ====="
        rm -f backup-32.gz
        gzip -9 -c "$P9_IMG" > backup-32.gz
        B32_SIZE=$(stat -c%s backup-32.gz)
        echo "backup-32.gz: $B32_SIZE 字节 ($((B32_SIZE/1024/1024)) MB)"
        echo "⚠️  此 backup-32.gz 完全由上面审计过的 p9-rootfs.img 压缩而来"
        echo "   与原厂 backup-32.gz 无关（原厂 backup-32.gz 从未被读取）"

        P8_MAX=$((P8_SIZE - 10*1024*1024))
        if [ "$B32_SIZE" -ge "$P8_MAX" ]; then
          echo "❌ backup-32.gz 太大: $B32_SIZE >= $P8_MAX"
          exit 1
        fi
        echo "✅ backup-32.gz 可放入 p8"

        # ========== 步骤7.3：创建 p8 backup ext4（只放新 backup-32.gz）==========
        echo ""
        echo "===== 7.3 创建 p8 backup ext4 ($P8_SIZE 字节) ====="
        P8_IMG="p8-backup.img"
        rm -f "$P8_IMG"
        dd if=/dev/zero of="$P8_IMG" bs=1 count=0 seek="$P8_SIZE" status=progress
        mkfs.ext4 -F -m 0 -L "backup" "$P8_IMG"

        mkdir -p mnt_p8
        sudo mount -o loop "$P8_IMG" mnt_p8
        # 【唯一拷贝动作】只放新生成的 backup-32.gz
        sudo cp backup-32.gz mnt_p8/
        sync

        # ============================================================
        # 【审计 5】新 p8 必须只有 backup-32.gz + lost+found
        # ============================================================
        echo ""
        echo "========== 审计5：新 p8 分区内容 =========="
        sudo ls -la mnt_p8/ | awk 'NR>1 {print $1, $3, $4, $9}'
        P8_FILES=$(sudo find mnt_p8 -mindepth 1 -maxdepth 1 \
            ! -name 'lost+found' 2>/dev/null)
        P8_FILE_COUNT=$(echo "$P8_FILES" | grep -c . || true)
        echo "非 lost+found 文件数: $P8_FILE_COUNT（期望 1）"
        if [ "$P8_FILE_COUNT" -ne 1 ]; then
          echo "❌ p8 内容数量异常"
          sudo umount mnt_p8
          exit 1
        fi
        if [ ! -f "mnt_p8/backup-32.gz" ]; then
          echo "❌ p8 内缺 backup-32.gz"
          sudo umount mnt_p8
          exit 1
        fi
        # 确认 p8 里的 backup-32.gz 就是我们刚生成的（对比大小）
        P8_B32_SIZE=$(sudo stat -c%s mnt_p8/backup-32.gz)
        if [ "$P8_B32_SIZE" != "$B32_SIZE" ]; then
          echo "❌ p8 内 backup-32.gz 大小不符: $P8_B32_SIZE != $B32_SIZE"
          sudo umount mnt_p8
          exit 1
        fi
        echo "✅ 审计5通过：p8 内只有 backup-32.gz（大小与生成的一致）"

        sudo umount mnt_p8
        e2fsck -p -f "$P8_IMG" || true
        echo "p8 raw: $(stat -c%s "$P8_IMG") 字节"

        # ========== 步骤7.4：转 sparse ==========
        echo ""
        echo "===== 7.4 转 Android sparse ====="
        rm -f www_ecoo_top.img
        img2simg "$P8_IMG" "www_ecoo_top.img"
        SP_BLK_SZ=$(od -An -tu4 -j12 -N4 www_ecoo_top.img | tr -d ' ')
        SP_TOTAL_BLKS=$(od -An -tu4 -j16 -N4 www_ecoo_top.img | tr -d ' ')
        SP_TOTAL_SIZE=$((SP_BLK_SZ * SP_TOTAL_BLKS))
        echo "sparse: blk_sz=$SP_BLK_SZ total_blks=$SP_TOTAL_BLKS => $SP_TOTAL_SIZE 字节"
        [ "$SP_TOTAL_SIZE" = "$P8_SIZE" ] || { echo "❌ sparse 大小不符"; exit 1; }
        xxd -l 4 www_ecoo_top.img
        ls -lh www_ecoo_top.img

        echo "B32_SIZE=$B32_SIZE" >> "$GITHUB_ENV"
        echo "ROOTFS_MB=$ROOTFS_MB" >> "$GITHUB_ENV"
        rm -f "$P9_IMG"

        # ========== 最终数据流声明 ==========
        echo ""
        echo "=============================================="
        echo "✅ step 7 完成"
        echo "   数据流：Ubuntu Base → usb_pure_rootfs → 新 p9 ext4 → 新 backup-32.gz → 新 p8 ext4 → sparse"
        echo "   原厂 p8 内容：从未解压、从未挂载、从未复制"
        echo "   所有审计通过：新 p9 干净、新 p8 干净"
        echo "=============================================="

    # ============================================================
    # 白名单复制 + U 盘根审计
    # ============================================================
    - name: 8. 白名单复制并重新打包
      run: |
        SOURCE_OS="Ubuntu_${{ env.UBUNTU_VERSION }}"
        FINAL_DIR="USB-hi3798mv100-${{ env.DEVICE_MODEL }}-PURE"
        rm -rf "$FINAL_DIR"
        mkdir -p "$FINAL_DIR/mv100"

        WHITELIST=(
          "bootargs.bin"
          "fastboot.bin"
          "mv100/baseparam.img"
          "mv100/bootargs.bin"
          "mv100/fastboot.bin"
          "mv100/hi_kernel.bin"
          "mv100/logo.img"
          "mv100/pq_param.bin"
          "mv100/recoverybox32.ext4"
        )
        echo "========== 白名单复制（只复制 fastboot 需要的）=========="
        for f in "${WHITELIST[@]}"; do
          if [ ! -f "usb_template/$f" ]; then
            echo "❌ 缺必要文件: $f"
            exit 1
          fi
          mkdir -p "$FINAL_DIR/$(dirname "$f")"
          cp "usb_template/$f" "$FINAL_DIR/$f"
          echo "  + $f"
        done

        # 替换为我们的新 p8
        cp www_ecoo_top.img "$FINAL_DIR/mv100/www_ecoo_top.ext4"
        echo "  + mv100/www_ecoo_top.ext4 (新构建，含新 backup-32.gz)"

        # 审计：最终包只有 10 个文件
        echo "========== 最终刷机包文件清单 =========="
        ACTUAL_FILES=$(find "$FINAL_DIR" -type f | sort)
        echo "$ACTUAL_FILES"
        ACTUAL_COUNT=$(echo "$ACTUAL_FILES" | wc -l)
        EXPECTED_COUNT=$(( ${#WHITELIST[@]} + 1 ))
        echo "文件数: $ACTUAL_COUNT（期望 $EXPECTED_COUNT）"
        if [ "$ACTUAL_COUNT" -ne "$EXPECTED_COUNT" ]; then
          echo "❌ 文件数量不符"
          exit 1
        fi
        for f in $ACTUAL_FILES; do
          REL="${f#$FINAL_DIR/}"
          if [ "$REL" = "mv100/www_ecoo_top.ext4" ]; then continue; fi
          MATCH=0
          for w in "${WHITELIST[@]}"; do
            [ "$REL" = "$w" ] && MATCH=1 && break
          done
          if [ "$MATCH" -eq 0 ]; then
            echo "❌ 非白名单文件: $REL"
            exit 1
          fi
        done
        echo "✅ 审计通过：只有 10 个 fastboot 需要的文件"

        INNER_ZIP="USB-hi3798mv100-${{ env.DEVICE_MODEL }}-PURE-${SOURCE_OS}-$(date +%Y%m%d).zip"
        cd "$FINAL_DIR"
        zip -q -r "../${INNER_ZIP}" .
        cd ..
        echo "INNER_ZIP=${INNER_ZIP}" >> "$GITHUB_ENV"
        echo "SOURCE_OS=${SOURCE_OS}" >> "$GITHUB_ENV"
        ls -lh "${INNER_ZIP}"

    - name: 9. 打包总包（含说明文档）
      run: |
        RELEASE_ZIP="Hi3798mv100_USB_${{ env.DEVICE_MODEL }}_${SOURCE_OS}.zip"
        mkdir -p release_staging
        cp "${INNER_ZIP}" "release_staging/"
        cp www_ecoo_top.img "release_staging/www_ecoo_top.ext4"

        cat > "release_staging/刷机包说明.txt" << EOF
        ================================================================
          Hi3798MV100 USB 纯净刷机包 — 使用说明
        ================================================================

        【构建信息】
          设备型号：      ${{ env.DEVICE_MODEL }}
          编译源系统：    Ubuntu ${{ env.UBUNTU_VERSION }}
          rootfs 实际：   ${ROOTFS_MB} MB
          p9 ext4 初始：  ${P9_SIZE_MB} MB
          p8 分区大小：   $((P8_SIZE/1024/1024)) MB
          backup-32.gz：  $((B32_SIZE/1024/1024)) MB（新生成）
          自定义 MAC：    ${{ env.CUSTOM_MAC }}
          构建日期：      $(date '+%Y-%m-%d %H:%M:%S')

        【构建流程保证】
          本刷机包的 p9 rootfs 完全从 Ubuntu Base 构建，与原厂 p9 内容无任何交集：
          - 原厂 www_ecoo_top.ext4 仅读取 20 字节 sparse 头用于计算 P8_SIZE
          - 原厂 backup-32.gz 从未被解压、从未被挂载、从未被复制
          - 新 p9 只包含 usb_pure_rootfs/ 的内容
          - 审计通过：新 p9 /root/ 只有 .bashrc/.profile/.cache/.local
          - 审计通过：新 p9 全盘无 zip/ext4/img/诊断脚本等残留

        【root 账号信息】
          用户名：        root
          初始密码：      ${{ env.ROOT_PASSWORD }}
          ⚠️ 首次登录后请立即执行 passwd root 修改密码！

        【刷机包结构（白名单，共 10 个文件）】
          顶层：bootargs.bin, fastboot.bin
          mv100/：baseparam.img, bootargs.bin, fastboot.bin, hi_kernel.bin,
                  logo.img, pq_param.bin, recoverybox32.ext4, www_ecoo_top.ext4

        【刷机步骤】
          1. 将刷机包 zip 解压到 U 盘根目录（FAT32）
          2. U 盘插入机顶盒 USB 口
          3. 按住 Recovery 按钮通电，等待自动刷机
          4. 首次启动较慢，耐心等待

        【注意事项】
          - 刷机前请确认设备型号与本包匹配
          - U 盘建议 USB 2.0 接口
          - root 初始密码为：${{ env.ROOT_PASSWORD }}
        ================================================================
        EOF
        sed -i 's/^        //' "release_staging/刷机包说明.txt"

        cd release_staging
        zip -q -r "../${RELEASE_ZIP}" .
        cd ..
        echo "RELEASE_ZIP=${RELEASE_ZIP}" >> "$GITHUB_ENV"
        ls -lh "${RELEASE_ZIP}"

    - name: 10. 上传 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Hi3798mv100_USB_${{ env.DEVICE_MODEL }}_${{ env.SOURCE_OS }}
        path: |
          Hi3798mv100_USB_${{ env.DEVICE_MODEL }}_${{ env.SOURCE_OS }}.zip
        retention-days: 7
        if-no-files-found: error

    - name: 11. 上传到 GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ github.run_number }}-${{ env.DEVICE_MODEL }}
        name: "Hi3798MV100 USB 纯净刷机包 - ${{ env.DEVICE_MODEL }} (${{ env.SOURCE_OS }})"
        body: |
          ## Hi3798MV100 USB 纯净刷机包

          | 项目 | 内容 |
          |------|------|
          | 设备型号 | `${{ env.DEVICE_MODEL }}` |
          | 编译源系统 | `Ubuntu ${{ env.UBUNTU_VERSION }}` |
          | rootfs 实际 | `${ROOTFS_MB} MB` |
          | p9 ext4 初始 | `${P9_SIZE_MB} MB` |
          | p8 分区 | `$((P8_SIZE/1024/1024)) MB` |
          | backup-32.gz | `$((B32_SIZE/1024/1024)) MB` |

          ### 构建保证
          - p9 rootfs 完全从 Ubuntu Base 构建，与原厂 p9 内容无交集
          - 原厂 backup-32.gz 从未被解压或复制
