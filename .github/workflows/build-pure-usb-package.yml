name: 编译Hi3798mv100的ubuntu系统USB刷机包

on:
  workflow_dispatch:
    inputs:
      device_model:
        description: '设备型号（如 mdmo1f），修改此项可全局变更设备标识'
        required: false
        default: 'mdmo1f'
      usb_url:
        description: '原始 USB 刷机包下载地址（不填则根据 device_model 自动拼接）'
        required: false
      base_version:
        description: 'Ubuntu Base 版本号（如 20.04.5 / 22.04.5），修改此项可全局变更 Ubuntu 版本'
        required: false
        default: '22.04.5'
      base_url:
        description: 'Ubuntu Base 下载目录'
        required: false
        default: 'https://cdimage.ubuntu.com/ubuntu-base/releases/22.04/release'
      mirror:
        description: 'apt 软件源镜像'
        required: false
        default: 'http://repo.huaweicloud.com/ubuntu-ports'
      root_password:
        description: 'root 登录密码（生产环境务必修改）'
        required: false
        default: 'root123'
  push:
    branches: [ main ]
    paths:
      - 'build_rootfs.sh'
      - 'build_usb_rootfs.sh'
      - 'lib/**'
      - '.github/workflows/**'

concurrency:
  group: build-usb-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-usb-pure:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    env:
      DEVICE_MODEL: ${{ inputs.device_model }}
      USB_URL: ${{ inputs.usb_url || format('https://node4.histb.com:9088/update/system/mv100-{0}-usb-flash.zip', inputs.device_model) }}
      UBUNTU_VERSION: ${{ inputs.base_version }}
      BASE_URL: ${{ inputs.base_url }}
      MIRROR: ${{ inputs.mirror }}
      ROOT_PASSWORD: ${{ inputs.root_password }}

    steps:
    - name: 1. 检出代码
      uses: actions/checkout@v4

    - name: 2. 下载原始 USB 刷机包
      run: |
        wget --no-check-certificate -c --tries=5 --timeout=60 --waitretry=10 "$USB_URL" -O original_usb.zip
        ls -lh original_usb.zip
        unzip -tq original_usb.zip >/dev/null || { echo "ERROR 原始包损坏"; exit 1; }
        echo "原始包完整性 OK"

    - name: 3. 解压并分析原系统镜像
      run: |
        rm -rf usb_template
        mkdir -p usb_template
        unzip -q original_usb.zip -d usb_template/
        echo "包内容:"
        ls -la usb_template/mv100/
        test -f "usb_template/mv100/www_ecoo_top.ext4" || { echo "未找到 www_ecoo_top.ext4"; exit 1; }
        cp "usb_template/mv100/www_ecoo_top.ext4" original_system.ext4
        MAGIC=$(xxd -l 4 -p "original_system.ext4" 2>/dev/null | tr -d '\n' | head -c 8)
        FILE_SIZE=$(stat -c%s "original_system.ext4")
        echo "原始文件物理大小: $FILE_SIZE 字节"
        echo "文件头 magic: $MAGIC"
        if [ "$MAGIC" = "3aff26ed" ]; then
          echo "原始镜像为 Android sparse 格式"
          echo "ORIG_IS_SPARSE=true" >> "$GITHUB_ENV"
          BLK_SZ=$(od -An -j12 -N4 -tu4 "original_system.ext4" | head -1 | tr -d ' ')
          TOTAL_BLKS=$(od -An -j16 -N4 -tu4 "original_system.ext4" | head -1 | tr -d ' ')
          VIRTUAL_SIZE=$(( BLK_SZ * TOTAL_BLKS ))
          echo "sparse 虚拟大小: $VIRTUAL_SIZE 字节 ($(( VIRTUAL_SIZE / 1024 / 1024 )) MB)"
          echo "VIRTUAL_SIZE=$VIRTUAL_SIZE" >> "$GITHUB_ENV"
        else
          echo "原始镜像为普通 ext4 格式"
          echo "ORIG_IS_SPARSE=false" >> "$GITHUB_ENV"
          echo "VIRTUAL_SIZE=$FILE_SIZE" >> "$GITHUB_ENV"
        fi

    - name: 4. 安装依赖
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq qemu-user-static e2fsprogs zip
        sudo apt-get install -y -qq android-sdk-libsparse-utils 2>/dev/null || true
        if command -v img2simg >/dev/null 2>&1; then
          echo "img2simg 已安装"
          echo "SPARSE_METHOD=img2simg" >> "$GITHUB_ENV"
        else
          echo "img2simg 不可用, 将使用 Python 备用方案"
          echo "SPARSE_METHOD=python" >> "$GITHUB_ENV"
          echo "" | base64 -d > /tmp/ext2simg.py
          echo "Python sparse 转换脚本已就绪"
        fi

    - name: 5. 缓存 Ubuntu Base 镜像
      uses: actions/cache@v4
      with:
        path: cache/ubuntu-base-*.tar.gz
        key: ubuntu-base-${{ env.UBUNTU_VERSION }}

    - name: 6. 构建纯净根文件系统
      run: |
        chmod +x build_usb_rootfs.sh
        ./build_usb_rootfs.sh

    - name: 7. 创建 ext4 镜像并转换为 sparse 格式
      run: |
        VIRTUAL_SIZE="${{ env.VIRTUAL_SIZE }}"
        echo "使用虚拟大小创建 ext4: $VIRTUAL_SIZE 字节 ($(( VIRTUAL_SIZE / 1024 / 1024 )) MB)"
        PURE_IMG="usb-rootfs-pure.ext4"
        dd if=/dev/zero of="$PURE_IMG" bs=1 count=0 seek=$VIRTUAL_SIZE status=progress
        mkfs.ext4 -F -m 0 -L "pure_root" "$PURE_IMG"
        mkdir -p temp_mount
        sudo mount -o loop "$PURE_IMG" temp_mount
        sudo cp -a usb_pure_rootfs/. temp_mount/
        sync
        sudo umount temp_mount
        e2fsck -p -f "$PURE_IMG" || true
        echo "ext4 镜像大小:"
        ls -lh "$PURE_IMG"
        if [ "${{ env.ORIG_IS_SPARSE }}" = "true" ]; then
          echo "原始镜像为 sparse 格式, 执行转换..."
          if [ "${{ env.SPARSE_METHOD }}" = "img2simg" ]; then
            img2simg "$PURE_IMG" "${PURE_IMG}.sparse"
            mv "${PURE_IMG}.sparse" "$PURE_IMG"
            echo "已通过 img2simg 转换为 sparse 格式"
          else
            python3 /tmp/ext2simg.py "$PURE_IMG"
            echo "已通过 Python 脚本转换为 sparse 格式"
          fi
          MAGIC=$(xxd -l 4 -p "$PURE_IMG" 2>/dev/null | tr -d '\n' | head -c 8)
          if [ "$MAGIC" = "3aff26ed" ]; then
            V_BLK=$(od -An -j12 -N4 -tu4 "$PURE_IMG" | head -1 | tr -d ' ')
            V_BLKS=$(od -An -j16 -N4 -tu4 "$PURE_IMG" | head -1 | tr -d ' ')
            V_SIZE=$(( V_BLK * V_BLKS ))
            echo "sparse 验证通过: 虚拟大小 $V_SIZE 字节 ($(( V_SIZE / 1024 / 1024 )) MB)"
            if [ "$V_SIZE" -eq "$VIRTUAL_SIZE" ]; then
              echo "虚拟大小与分区匹配"
            else
              echo "虚拟大小不匹配! sparse=$V_SIZE 期望=$VIRTUAL_SIZE"
              exit 1
            fi
          else
            echo "sparse 转换失败 (magic: $MAGIC)"
            exit 1
          fi
        fi
        echo "最终镜像:"
        ls -lh "$PURE_IMG"

    - name: 8. 替换并重新打包
      run: |
        SOURCE_OS="Ubuntu_${{ env.UBUNTU_VERSION }}"
        FINAL_DIR="USB-hi3798mv100-${{ env.DEVICE_MODEL }}-PURE"
        rm -rf "$FINAL_DIR"
        cp -r usb_template "$FINAL_DIR"
        rm -f "$FINAL_DIR/mv100/www_ecoo_top.ext4"
        cp usb-rootfs-pure.ext4 "$FINAL_DIR/mv100/www_ecoo_top.ext4"
        INNER_ZIP="USB-hi3798mv100-${{ env.DEVICE_MODEL }}-PURE-${SOURCE_OS}-$(date +%Y%m%d).zip"
        cd "$FINAL_DIR"
        zip -q -r "../${INNER_ZIP}" .
        cd ..
        echo "INNER_ZIP=${INNER_ZIP}" >> "$GITHUB_ENV"
        echo "SOURCE_OS=${SOURCE_OS}" >> "$GITHUB_ENV"
        echo "最终刷机包:"
        ls -lh "${INNER_ZIP}"

    - name: 9. 打包总包
      run: |
        RELEASE_ZIP="Hi3798mv100_USB_${{ env.DEVICE_MODEL }}_${SOURCE_OS}.zip"
        mkdir -p release_staging
        cp "${INNER_ZIP}" "release_staging/"
        cp usb-rootfs-pure.ext4 "release_staging/"
        cd release_staging
        zip -q -r "../${RELEASE_ZIP}" .
        cd ..
        echo "RELEASE_ZIP=${RELEASE_ZIP}" >> "$GITHUB_ENV"
        echo "总包:"
        ls -lh "${RELEASE_ZIP}"

    - name: 10. 上传 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Hi3798mv100_USB_${{ env.DEVICE_MODEL }}_${{ env.SOURCE_OS }}
        path: |
          Hi3798mv100_USB_${{ env.DEVICE_MODEL }}_${{ env.SOURCE_OS }}.zip
        retention-days: 7
        if-no-files-found: error

    - name: 11. 上传到 GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ github.run_number }}-${{ env.DEVICE_MODEL }}
        name: "Hi3798MV100 USB - ${{ env.DEVICE_MODEL }} (${{ env.SOURCE_OS }})"
        body: |
          ## Hi3798MV100 USB 纯净刷机包

          | 项目 | 内容 |
          |------|------|
          | 设备型号 | `${{ env.DEVICE_MODEL }}` |
          | 编译源系统 | `Ubuntu ${{ env.UBUNTU_VERSION }}` |
          | root 初始密码 | `${{ env.ROOT_PASSWORD }}` |
        files: |
          Hi3798mv100_USB_${{ env.DEVICE_MODEL }}_${{ env.SOURCE_OS }}.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: 12. 清理
      if: always()
      run: |
        sudo rm -rf usb_pure_rootfs temp_mount usb_template USB-hi3798mv100-${{ env.DEVICE_MODEL }}-PURE release_staging 2>/dev/null || true
        rm -f original_usb.zip original_system.ext4 usb-rootfs-pure.ext4 /tmp/ext2simg.py 2>/dev/null || true
        echo "清理完成。"
