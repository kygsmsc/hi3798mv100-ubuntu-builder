name: 编译Hi3798mv100的ubuntu系统USB刷机包

on:
  workflow_dispatch:
    inputs:
      device_model:
        description: '设备型号（如 mdmo1f），修改此项可全局变更设备标识'
        required: false
        default: 'mdmo1f'
      usb_url:
        description: '原始 USB 刷机包下载地址（不填则根据 device_model 自动拼接）'
        required: false
      base_version:
        description: 'Ubuntu Base 版本号（如 20.04.5 / 22.04.5），修改此项可全局变更 Ubuntu 版本'
        required: false
        default: '22.04.5'
      base_url:
        description: 'Ubuntu Base 下载目录'
        required: false
        default: 'https://cdimage.ubuntu.com/ubuntu-base/releases/22.04/release'
      mirror:
        description: 'apt 软件源镜像'
        required: false
        default: 'http://repo.huaweicloud.com/ubuntu-ports'
      root_password:
        description: 'root 登录密码（生产环境务必修改）'
        required: false
        default: 'root123'
  push:
    branches: [ main ]
    paths:
      - 'build_rootfs.sh'
      - 'build_usb_rootfs.sh'
      - 'lib/**'
      - '.github/workflows/**'

concurrency:
  group: build-usb-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-usb-pure:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    env:
      DEVICE_MODEL: ${{ inputs.device_model }}
      USB_URL: ${{ inputs.usb_url || format('https://node4.histb.com:9088/update/system/mv100-{0}-usb-flash.zip', inputs.device_model) }}
      UBUNTU_VERSION: ${{ inputs.base_version }}
      BASE_URL: ${{ inputs.base_url }}
      MIRROR: ${{ inputs.mirror }}
      ROOT_PASSWORD: ${{ inputs.root_password }}

    steps:
    - name: 1. 检出代码
      uses: actions/checkout@v4

    - name: 2. 下载原始 USB 刷机包
      run: |
        wget --no-check-certificate -c --tries=5 --timeout=60 --waitretry=10 "$USB_URL" -O original_usb.zip
        ls -lh original_usb.zip
        unzip -tq original_usb.zip >/dev/null || { echo "❌ 原始包损坏"; exit 1; }
        echo "✅ 原始包完整性 OK"

    - name: 3. 解压并分析原系统镜像
      run: |
        rm -rf usb_template
        mkdir -p usb_template
        unzip -q original_usb.zip -d usb_template/
        echo "包内容:"
        ls -la usb_template/mv100/
        test -f "usb_template/mv100/www_ecoo_top.ext4" && echo "✅ 找到 www_ecoo_top.ext4" || { echo "❌ 未找到 www_ecoo_top.ext4"; exit 1; }
        cp "usb_template/mv100/www_ecoo_top.ext4" original_system.ext4
        echo "✅ 已备份原系统文件:"
        ls -lh original_system.ext4

        # ========== 检测原始镜像格式并提取虚拟大小 ==========
        MAGIC=$(xxd -l 4 -p "original_system.ext4" 2>/dev/null | tr -d '\n' | head -c 8)
        FILE_SIZE=$(stat -c%s "original_system.ext4")
        echo "原始文件物理大小: $FILE_SIZE 字节"
        echo "文件头 magic: $MAGIC"

        if [ "$MAGIC" = "3aff26ed" ]; then
          echo "✅ 原始镜像为 Android sparse 格式"
          echo "ORIG_IS_SPARSE=true" >> "$GITHUB_ENV"

          # 从 sparse header 提取虚拟大小
          # sparse header 结构:
          #   offset 0x0C: blk_sz (4 bytes, little-endian)
          #   offset 0x10: total_blks (4 bytes, little-endian)
          #   virtual_size = blk_sz * total_blks
          BLOCK_SIZE=$(python3 -c "
          import struct
          with open('original_system.ext4', 'rb') as f:
              f.seek(0x0C)
              blk_sz = struct.unpack('<I', f.read(4))[0]
              total_blks = struct.unpack('<I', f.read(4))[0]
              virtual_size = blk_sz * total_blks
              print(f'{blk_sz} {total_blks} {virtual_size}')
          ")
          echo "sparse header 解析结果: $BLOCK_SIZE"
          BLK_SZ=$(echo "$BLOCK_SIZE" | awk '{print $1}')
          TOTAL_BLKS=$(echo "$BLOCK_SIZE" | awk '{print $2}')
          VIRTUAL_SIZE=$(echo "$BLOCK_SIZE" | awk '{print $3}')
          echo "  块大小: $BLK_SZ 字节"
          echo "  总块数: $TOTAL_BLKS"
          echo "  虚拟大小: $VIRTUAL_SIZE 字节 ($(( VIRTUAL_SIZE / 1024 / 1024 )) MB)"
          echo "VIRTUAL_SIZE=$VIRTUAL_SIZE" >> "$GITHUB_ENV"
        else
          echo "ℹ️  原始镜像为普通 ext4 格式"
          echo "ORIG_IS_SPARSE=false" >> "$GITHUB_ENV"
          echo "VIRTUAL_SIZE=$FILE_SIZE" >> "$GITHUB_ENV"
        fi

    - name: 4. 安装依赖
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq qemu-user-static e2fsprogs zip
        # 安装 img2simg（普通 ext4 → Android sparse 转换）
        sudo apt-get install -y -qq android-sdk-libsparse-utils 2>/dev/null || true
        if command -v img2simg >/dev/null 2>&1; then
          echo "✅ img2simg 已安装"
          echo "SPARSE_METHOD=img2simg" >> "$GITHUB_ENV"
        else
          echo "ℹ️  img2simg 不可用，将使用 Python 备用方案"
          echo "SPARSE_METHOD=python" >> "$GITHUB_ENV"
        fi

    - name: 5. 缓存 Ubuntu Base 镜像
      uses: actions/cache@v4
      with:
        path: cache/ubuntu-base-*.tar.gz
        key: ubuntu-base-${{ env.UBUNTU_VERSION }}

    - name: 6. 构建纯净根文件系统
      run: |
        chmod +x build_usb_rootfs.sh
        ./build_usb_rootfs.sh

    - name: 7. 创建 ext4 镜像并转换为 sparse 格式
      run: |
        VIRTUAL_SIZE="${{ env.VIRTUAL_SIZE }}"
        echo "=============================================="
        echo "使用虚拟大小创建 ext4: $VIRTUAL_SIZE 字节 ($(( VIRTUAL_SIZE / 1024 / 1024 )) MB)"
        echo "=============================================="

        PURE_IMG="usb-rootfs-pure.ext4"

        # 【关键修复】使用虚拟大小（而非文件物理大小）创建 ext4
        # 这样 sparse 转换后的 total_blocks 才能匹配设备分区大小
        dd if=/dev/zero of="$PURE_IMG" bs=1 count=0 seek=$VIRTUAL_SIZE status=progress
        mkfs.ext4 -F -m 0 -L "pure_root" "$PURE_IMG"
        mkdir -p temp_mount
        sudo mount -o loop "$PURE_IMG" temp_mount
        sudo cp -a usb_pure_rootfs/. temp_mount/
        sync
        sudo umount temp_mount
        e2fsck -p -f "$PURE_IMG" || true

        echo "ext4 镜像大小（与分区匹配）:"
        ls -lh "$PURE_IMG"

        # ========== 转换为 Android sparse 格式 ==========
        if [ "${{ env.ORIG_IS_SPARSE }}" = "true" ]; then
          echo "原始镜像为 sparse 格式，执行转换..."

          if [ "${{ env.SPARSE_METHOD }}" = "img2simg" ]; then
            img2simg "$PURE_IMG" "${PURE_IMG}.sparse"
            mv "${PURE_IMG}.sparse" "$PURE_IMG"
            echo "✅ 已通过 img2simg 转换为 sparse 格式"
          else
            echo "使用 Python 备用方案转换..."
            python3 << 'PYSPARSE'
        import struct, os

        SPARSE_MAGIC = 0xED26FF3A
        CHUNK_RAW = 0xCAC1
        CHUNK_DONT_CARE = 0xCAC3
        BLOCK_SIZE = 4096
        SPARSE_HDR_SIZE = 28
        CHUNK_HDR_SIZE = 12

        src = "usb-rootfs-pure.ext4"
        dst = src + ".sparse"

        with open(src, 'rb') as f:
            data = f.read()

        total_blocks = len(data) // BLOCK_SIZE
        chunks = []
        i = 0
        while i < len(data):
            block = data[i:i+BLOCK_SIZE]
            if block == b'\x00' * BLOCK_SIZE:
                count = 0
                while i < len(data):
                    if data[i:i+BLOCK_SIZE] == b'\x00' * BLOCK_SIZE:
                        count += 1
                        i += BLOCK_SIZE
                    else:
                        break
                chunks.append((CHUNK_DONT_CARE, count, b''))
            else:
                raw = b''
                count = 0
                while i < len(data):
                    b = data[i:i+BLOCK_SIZE]
                    if b != b'\x00' * BLOCK_SIZE:
                        raw += b
                        count += 1
                        i += BLOCK_SIZE
                    else:
                        break
                chunks.append((CHUNK_RAW, count, raw))

        with open(dst, 'wb') as f:
            f.write(struct.pack('<IHHHHIIi',
                SPARSE_MAGIC, 1, 0, SPARSE_HDR_SIZE, CHUNK_HDR_SIZE,
                BLOCK_SIZE, total_blocks, len(chunks), 0))
            for ct, bc, cd in chunks:
                f.write(struct.pack('<HHII', ct, 0, bc, CHUNK_HDR_SIZE + len(cd)))
                f.write(cd)

        os.replace(dst, src)
        print(f"✅ Python sparse 转换完成 ({len(chunks)} chunks, {total_blocks} blocks)")
        PYSPARSE
          fi

          # 验证 sparse 格式
          MAGIC=$(xxd -l 4 -p "$PURE_IMG" 2>/dev/null | tr -d '\n' | head -c 8)
          if [ "$MAGIC" = "3aff26ed" ]; then
            echo "✅ sparse 格式验证通过 (magic: 0xED26FF3A)"
            # 验证虚拟大小
            python3 -c "
        import struct
        with open('$PURE_IMG', 'rb') as f:
            f.seek(0x0C)
            blk = struct.unpack('<I', f.read(4))[0]
            blks = struct.unpack('<I', f.read(4))[0]
            vs = blk * blks
            print(f'sparse 虚拟大小: {vs} 字节 ({vs // 1024 // 1024} MB)')
            assert vs == $VIRTUAL_SIZE, f'虚拟大小不匹配! sparse={vs} 期望=$VIRTUAL_SIZE'
            print('✅ 虚拟大小与分区匹配')
        "
          else
            echo "❌ sparse 转换失败 (magic: $MAGIC)"
            exit 1
          fi
        else
          echo "ℹ️  原始镜像不是 sparse 格式，跳过转换"
        fi

        echo "✅ 最终镜像:"
        ls -lh "$PURE_IMG"

    - name: 8. 替换并重新打包
      run: |
        SOURCE_OS="Ubuntu_${{ env.UBUNTU_VERSION }}"
        echo "编译源系统: ${SOURCE_OS}"

        FINAL_DIR="USB-hi3798mv100-${{ env.DEVICE_MODEL }}-PURE"
        rm -rf "$FINAL_DIR"
        cp -r usb_template "$FINAL_DIR"
        rm -f "$FINAL_DIR/mv100/www_ecoo_top.ext4"
        cp usb-rootfs-pure.ext4 "$FINAL_DIR/mv100/www_ecoo_top.ext4"

        echo "刷机包内容:"
        ls -l "$FINAL_DIR/mv100/"

        INNER_ZIP="USB-hi3798mv100-${{ env.DEVICE_MODEL }}-PURE-${SOURCE_OS}-$(date +%Y%m%d).zip"
        cd "$FINAL_DIR"
        zip -q -r "../${INNER_ZIP}" .
        cd ..
        echo "INNER_ZIP=${INNER_ZIP}" >> "$GITHUB_ENV"
        echo "SOURCE_OS=${SOURCE_OS}" >> "$GITHUB_ENV"
        echo "✅ 最终刷机包:"
        ls -lh "${INNER_ZIP}"

    - name: 9. 打包总包（含中文说明文档）
      run: |
        RELEASE_ZIP="Hi3798mv100_USB_${{ env.DEVICE_MODEL }}_${SOURCE_OS}.zip"

        mkdir -p release_staging
        cp "${INNER_ZIP}" "release_staging/"
        cp usb-rootfs-pure.ext4 "release_staging/"

        cat > "release_staging/刷机包说明.txt" << EOF
        ================================================================
          Hi3798MV100 USB 纯净刷机包 — 使用说明
        ================================================================

        【构建信息】
          设备型号：      ${{ env.DEVICE_MODEL }}
          编译源系统：    Ubuntu ${{ env.UBUNTU_VERSION }}
          Ubuntu Base：   ${{ env.UBUNTU_VERSION }}
          构建日期：      $(date '+%Y-%m-%d %H:%M:%S')

        【root 账号信息】
          用户名：        root
          初始密码：      ${{ env.ROOT_PASSWORD }}
          ⚠️ 首次登录后请立即执行 passwd root 修改密码！

        【刷机步骤】
          1. 将刷机包 zip 解压到 U 盘根目录（U 盘须为 FAT32 格式）
          2. 将 U 盘插入机顶盒 USB 口
          3. 按住机身侧面 Recovery 按钮，接通电源
          4. 等待进入刷机界面后松开按钮，自动开始刷机
          5. 进度条走完后自动重启，首次启动较慢请耐心等待

        【注意事项】
          - 刷机前请确认设备型号与本包匹配
          - U 盘建议使用 USB 2.0 接口
          - root 初始密码为：${{ env.ROOT_PASSWORD }}，请首次登录后立即修改

        ================================================================
        EOF
        sed -i 's/^        //' "release_staging/刷机包说明.txt"

        echo "说明文档预览:"
        cat "release_staging/刷机包说明.txt"

        cd release_staging
        zip -q -r "../${RELEASE_ZIP}" .
        cd ..
        echo "RELEASE_ZIP=${RELEASE_ZIP}" >> "$GITHUB_ENV"
        echo "✅ 总包:"
        ls -lh "${RELEASE_ZIP}"

    - name: 10. 上传 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Hi3798mv100_USB_${{ env.DEVICE_MODEL }}_${{ env.SOURCE_OS }}
        path: |
          Hi3798mv100_USB_${{ env.DEVICE_MODEL }}_${{ env.SOURCE_OS }}.zip
        retention-days: 7
        if-no-files-found: error

    - name: 11. 上传到 GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ github.run_number }}-${{ env.DEVICE_MODEL }}
        name: "Hi3798MV100 USB 纯净刷机包 - ${{ env.DEVICE_MODEL }} (${{ env.SOURCE_OS }})"
        body: |
          ## Hi3798MV100 USB 纯净刷机包

          | 项目 | 内容 |
          |------|------|
          | 设备型号 | `${{ env.DEVICE_MODEL }}` |
          | 编译源系统 | `Ubuntu ${{ env.UBUNTU_VERSION }}` |
          | root 初始密码 | `${{ env.ROOT_PASSWORD }}` |
          | 构建时间 | ${{ github.event.head_commit.timestamp || 'workflow_dispatch' }} |

          ### 账号信息
          - **用户名：** `root`
          - **初始密码：** `${{ env.ROOT_PASSWORD }}`
          - ⚠️ 首次登录后请立即执行 `passwd root` 修改密码！
        files: |
          Hi3798mv100_USB_${{ env.DEVICE_MODEL }}_${{ env.SOURCE_OS }}.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: 12. 清理
      if: always()
      run: |
        sudo rm -rf usb_pure_rootfs temp_mount usb_template USB-hi3798mv100-${{ env.DEVICE_MODEL }}-PURE release_staging 2>/dev/null || true
        rm -f original_usb.zip original_system.ext4 usb-rootfs-pure.ext4 2>/dev/null || true
        echo "✅ 清理完成。"
