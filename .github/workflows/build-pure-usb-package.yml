name: 编译Hi3798mv100的ubuntu系统USB刷机包

on:
  workflow_dispatch:
    inputs:
      device_model:
        description: '设备型号（如 mdmo1f），修改此项可全局变更设备标识'
        required: false
        default: 'mdmo1f'
      usb_url:
        description: '原始 USB 刷机包下载地址（不填则根据 device_model 自动拼接）'
        required: false
      base_version:
        description: 'Ubuntu Base 版本号（如 20.04.5 / 22.04.5），修改此项可全局变更 Ubuntu 版本'
        required: false
        default: '22.04.5'
      base_url:
        description: 'Ubuntu Base 下载目录'
        required: false
        default: 'https://cdimage.ubuntu.com/ubuntu-base/releases/22.04/release'
      mirror:
        description: 'apt 软件源镜像'
        required: false
        default: 'http://repo.huaweicloud.com/ubuntu-ports'
      root_password:
        description: 'root 登录密码（生产环境务必修改）'
        required: false
        default: 'root123'
  push:
    branches: [ main ]
    paths:
      - 'build_rootfs.sh'
      - 'build_usb_rootfs.sh'
      - 'lib/**'
      - '.github/workflows/**'

concurrency:
  group: build-usb-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-usb-pure:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    env:
      # ========== 全局变量：设备型号 ==========
      DEVICE_MODEL: ${{ inputs.device_model }}
      # USB_URL 自动根据 device_model 拼接；也可通过 usb_url 输入手动覆盖
      USB_URL: ${{ inputs.usb_url || format('https://node4.histb.com:9088/update/system/mv100-{0}-usb-flash.zip', inputs.device_model) }}
      # ========== 全局变量：Ubuntu Base 版本号 ==========
      UBUNTU_VERSION: ${{ inputs.base_version }}
      BASE_URL: ${{ inputs.base_url }}
      MIRROR: ${{ inputs.mirror }}
      ROOT_PASSWORD: ${{ inputs.root_password }}

    steps:
    - name: 1. 检出代码
      uses: actions/checkout@v4

    - name: 2. 下载原始 USB 刷机包
      run: |
        wget --no-check-certificate -c --tries=5 --timeout=60 --waitretry=10 "$USB_URL" -O original_usb.zip
        ls -lh original_usb.zip
        unzip -tq original_usb.zip >/dev/null || { echo "❌ 原始包损坏"; exit 1; }
        echo "✅ 原始包完整性 OK"

    - name: 3. 解压并备份原系统文件
      run: |
        rm -rf usb_template
        mkdir -p usb_template
        unzip -q original_usb.zip -d usb_template/
        echo "包内容:"
        ls -la usb_template/mv100/
        test -f "usb_template/mv100/www_ecoo_top.ext4" && echo "✅ 找到 www_ecoo_top.ext4" || { echo "❌ 未找到 www_ecoo_top.ext4"; exit 1; }
        cp "usb_template/mv100/www_ecoo_top.ext4" original_system.ext4
        echo "✅ 已备份原系统文件:"
        ls -lh original_system.ext4

        # ========== 检测原始镜像是否为 sparse 格式 ==========
        MAGIC=$(xxd -l 4 -p "original_system.ext4" 2>/dev/null | head -c 8 || echo "")
        if [ "$MAGIC" = "3aff26ed" ]; then
          echo "✅ 原始镜像为 Android sparse 格式，后续需要转换"
          echo "ORIG_IS_SPARSE=true" >> "$GITHUB_ENV"
        else
          echo "ℹ️  原始镜像为普通 ext4 格式"
          echo "ORIG_IS_SPARSE=false" >> "$GITHUB_ENV"
        fi

    - name: 4. 安装依赖
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq qemu-user-static e2fsprogs zip xxd
        # 安装 img2simg 工具（用于将普通 ext4 转换为 Android sparse 格式）
        sudo apt-get install -y -qq android-sdk-libsparse-utils 2>/dev/null || {
          echo "⚠️  android-sdk-libsparse-utils 不可用，尝试从源码编译 img2simg..."
          sudo apt-get install -y -qq build-essential
          cd /tmp
          git clone --depth 1 https://github.com/nicholasgasior/android-tools.git android-tools-src 2>/dev/null || {
            # 备用方案：直接用 Python 脚本做 sparse 转换
            echo "⚠️  源码编译也失败，将使用 Python 备用方案"
          }
          cd -
        }
        # 验证 img2simg 是否可用
        if command -v img2simg >/dev/null 2>&1; then
          echo "✅ img2simg 已安装"
          echo "SPARSE_METHOD=img2simg" >> "$GITHUB_ENV"
        else
          echo "ℹ️  将使用 Python 备用方案进行 sparse 转换"
          echo "SPARSE_METHOD=python" >> "$GITHUB_ENV"
        fi

    - name: 5. 缓存 Ubuntu Base 镜像（版本固定，可安全复用）
      uses: actions/cache@v4
      with:
        path: cache/ubuntu-base-*.tar.gz
        key: ubuntu-base-${{ env.UBUNTU_VERSION }}

    - name: 6. 构建纯净根文件系统
      run: |
        chmod +x build_usb_rootfs.sh
        ./build_usb_rootfs.sh

    - name: 7. 创建纯净 ext4 镜像并转换为 sparse 格式
      run: |
        ORIG_SIZE=$(stat -c%s "original_system.ext4")
        echo "基于原始大小 ($ORIG_SIZE 字节) 创建镜像..."
        PURE_IMG="usb-rootfs-pure.ext4"
        dd if=/dev/zero of="$PURE_IMG" bs=1 count=0 seek=$ORIG_SIZE status=progress
        mkfs.ext4 -F -m 0 -L "pure_root" "$PURE_IMG"
        mkdir -p temp_mount
        sudo mount -o loop "$PURE_IMG" temp_mount
        sudo cp -a usb_pure_rootfs/. temp_mount/
        sync
        sudo umount temp_mount
        e2fsck -p -f "$PURE_IMG" || true

        echo "普通 ext4 镜像大小:"
        ls -lh "$PURE_IMG"

        # ========== 转换为 Android sparse 格式 ==========
        # hi3798mv100 的 fastboot 使用 "MMC write ext4 sparse" 写入
        # 必须将普通 ext4 转换为 sparse 格式，否则刷机时出现 "Invalid sparse format" 错误
        if [ "${{ env.ORIG_IS_SPARSE }}" = "true" ]; then
          echo "原始镜像为 sparse 格式，执行转换..."

          if [ "${{ env.SPARSE_METHOD }}" = "img2simg" ]; then
            img2simg "$PURE_IMG" "${PURE_IMG}.sparse"
            mv "${PURE_IMG}.sparse" "$PURE_IMG"
            echo "✅ 已通过 img2simg 转换为 sparse 格式"
          else
            # Python 备用方案：使用 img2simg 的 Python 实现
            pip install img2simg 2>/dev/null && {
              python3 -c "
        import img2simg
        img2simg.main(['$PURE_IMG', '${PURE_IMG}.sparse'])
        " && {
                mv "${PURE_IMG}.sparse" "$PURE_IMG"
                echo "✅ 已通过 Python img2simg 转换为 sparse 格式"
              }
            } || {
              # 最终备用方案：手动实现最简 sparse 转换
              echo "⚠️  自动转换工具不可用，使用手动 sparse 脚本..."
              python3 << 'PYSPARSE'
        import struct, sys, os

        CHUNK_TYPE_RAW = 0xCAC1
        CHUNK_TYPE_FILL = 0xCAC2
        CHUNK_TYPE_DONT_CARE = 0xCAC3
        SPARSE_HEADER_MAGIC = 0xED26FF3A
        SPARSE_HEADER_SIZE = 28
        CHUNK_HEADER_SIZE = 12
        BLOCK_SIZE = 4096

        src = sys.argv[1] if len(sys.argv) > 1 else "usb-rootfs-pure.ext4"
        dst = src + ".sparse"

        with open(src, 'rb') as f:
            data = f.read()

        total_blocks = len(data) // BLOCK_SIZE
        chunks = []
        i = 0
        while i < len(data):
            block = data[i:i+BLOCK_SIZE]
            # 检查是否全零
            if block == b'\x00' * BLOCK_SIZE:
                # 连续零块合并为 DONT_CARE
                count = 0
                while i < len(data):
                    b = data[i:i+BLOCK_SIZE]
                    if b == b'\x00' * BLOCK_SIZE:
                        count += 1
                        i += BLOCK_SIZE
                    else:
                        break
                chunks.append((CHUNK_TYPE_DONT_CARE, count, b''))
            else:
                # 非零数据块合并为 RAW
                raw_data = b''
                count = 0
                while i < len(data):
                    b = data[i:i+BLOCK_SIZE]
                    if b != b'\x00' * BLOCK_SIZE:
                        raw_data += b
                        count += 1
                        i += BLOCK_SIZE
                    else:
                        break
                chunks.append((CHUNK_TYPE_RAW, count, raw_data))

        with open(dst, 'wb') as f:
            # Sparse header
            f.write(struct.pack('<I', SPARSE_HEADER_MAGIC))
            f.write(struct.pack('<HH', 1, 0))  # major, minor
            f.write(struct.pack('<H', 16))     # file header size
            f.write(struct.pack('<H', CHUNK_HEADER_SIZE))
            f.write(struct.pack('<I', BLOCK_SIZE))
            f.write(struct.pack('<I', total_blocks))
            f.write(struct.pack('<I', len(chunks)))
            f.write(struct.pack('<I', 0))  # crc

            for chunk_type, block_count, chunk_data in chunks:
                total_sz = CHUNK_HEADER_SIZE + len(chunk_data)
                f.write(struct.pack('<HHII', chunk_type, 0, block_count, total_sz))
                f.write(chunk_data)

        os.replace(dst, src)
        print(f"✅ 已通过 Python 手动脚本转换为 sparse 格式")
        PYSPARSE
              python3 - "$PURE_IMG" << 'PYSPARSE2'
        # 如果上面的内联脚本没执行到，这里做兜底
        pass
        PYSPARSE2
            }
          fi
        else
          echo "ℹ️  原始镜像不是 sparse 格式，跳过转换"
        fi

        echo "✅ 最终镜像:"
        ls -lh "$PURE_IMG"

        # 验证 sparse 格式
        MAGIC=$(xxd -l 4 -p "$PURE_IMG" 2>/dev/null | head -c 8 || echo "")
        if [ "$MAGIC" = "3aff26ed" ]; then
          echo "✅ sparse 格式验证通过 (magic: 0xED26FF3A)"
        elif [ "${{ env.ORIG_IS_SPARSE }}" = "true" ]; then
          echo "❌ sparse 转换可能失败，请检查 CI 日志"
          exit 1
        fi

    - name: 8. 替换并重新打包
      run: |
        # 编译源标识：Ubuntu 版本号（即本刷机包的 rootfs 基础系统）
        SOURCE_OS="Ubuntu_${{ env.UBUNTU_VERSION }}"
        echo "编译源系统: ${SOURCE_OS}"

        FINAL_DIR="USB-hi3798mv100-${{ env.DEVICE_MODEL }}-PURE"
        rm -rf "$FINAL_DIR"
        cp -r usb_template "$FINAL_DIR"
        rm -f "$FINAL_DIR/mv100/www_ecoo_top.ext4"
        cp usb-rootfs-pure.ext4 "$FINAL_DIR/mv100/www_ecoo_top.ext4"

        echo "刷机包内容:"
        ls -l "$FINAL_DIR/mv100/"

        # 刷机包 zip 文件名中加入编译源系统版本号
        INNER_ZIP="USB-hi3798mv100-${{ env.DEVICE_MODEL }}-PURE-${SOURCE_OS}-$(date +%Y%m%d).zip"
        cd "$FINAL_DIR"
        zip -q -r "../${INNER_ZIP}" .
        cd ..
        echo "INNER_ZIP=${INNER_ZIP}" >> "$GITHUB_ENV"
        echo "SOURCE_OS=${SOURCE_OS}" >> "$GITHUB_ENV"
        echo "✅ 最终刷机包:"
        ls -lh "${INNER_ZIP}"

    - name: 9. 打包总包（含中文说明文档）
      run: |
        # 总包命名：Hi3798mv100_USB_设备型号_编译源系统版本号.zip
        RELEASE_ZIP="Hi3798mv100_USB_${{ env.DEVICE_MODEL }}_${SOURCE_OS}.zip"

        mkdir -p release_staging
        # 将刷机包复制进总包
        cp "${INNER_ZIP}" "release_staging/"
        # 将纯 ext4 镜像也复制进总包（方便单独刷写）
        cp usb-rootfs-pure.ext4 "release_staging/"

        # ========== 生成中文说明文档 ==========
        cat > "release_staging/刷机包说明.txt" << EOF
        ================================================================
          Hi3798MV100 USB 纯净刷机包 — 使用说明
        ================================================================

        【构建信息】
          设备型号：      ${{ env.DEVICE_MODEL }}
          编译源系统：    Ubuntu ${{ env.UBUNTU_VERSION }}
          Ubuntu Base：   ${{ env.UBUNTU_VERSION }}
          构建日期：      $(date '+%Y-%m-%d %H:%M:%S')

        【root 账号信息】
          用户名：        root
          初始密码：      ${{ env.ROOT_PASSWORD }}
          ⚠️ 首次登录后请立即执行 passwd root 修改密码！

        ┌─────────────────────────────────────────────────┬────────────────────────────────────┐
        │ 文件 / 目录                                     │ 说明                               │
        ├─────────────────────────────────────────────────┼────────────────────────────────────┤
        │ ${INNER_ZIP}                                    │ 完整刷机包（含 ext4 镜像和引导文件）│
        │ usb-rootfs-pure.ext4                            │ 纯净根文件系统 ext4 镜像（备份）    │
        │ 刷机包说明.txt                                   │ 本说明文档                         │
        └─────────────────────────────────────────────────┴────────────────────────────────────┘

        【刷机步骤】
          1. 将刷机包 zip 解压到 U 盘根目录（U 盘须为 FAT32 格式）
          2. 将 U 盘插入机顶盒 USB 口
          3. 按住机身侧面 Recovery 按钮，接通电源
          4. 等待进入刷机界面后松开按钮，自动开始刷机
          5. 进度条走完后自动重启，首次启动较慢请耐心等待

        【注意事项】
          - 刷机前请确认设备型号与本包匹配，刷错型号可能导致变砖
          - U 盘建议使用 USB 2.0 接口，部分设备不兼容 USB 3.0
          - root 初始密码为：${{ env.ROOT_PASSWORD }}，请首次登录后立即修改
          - 如遇问题请检查 U 盘格式是否为 FAT32

        ================================================================
        EOF
        # 去掉 heredoc 的缩进前导空格
        sed -i 's/^        //' "release_staging/刷机包说明.txt"

        echo "说明文档预览:"
        cat "release_staging/刷机包说明.txt"

        # 打总包
        cd release_staging
        zip -q -r "../${RELEASE_ZIP}" .
        cd ..
        echo "RELEASE_ZIP=${RELEASE_ZIP}" >> "$GITHUB_ENV"
        echo "✅ 总包:"
        ls -lh "${RELEASE_ZIP}"

    - name: 10. 上传 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Hi3798mv100_USB_${{ env.DEVICE_MODEL }}_${{ env.SOURCE_OS }}
        path: |
          Hi3798mv100_USB_${{ env.DEVICE_MODEL }}_${{ env.SOURCE_OS }}.zip
        retention-days: 7
        if-no-files-found: error

    - name: 11. 上传到 GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ github.run_number }}-${{ env.DEVICE_MODEL }}
        name: "Hi3798MV100 USB 纯净刷机包 - ${{ env.DEVICE_MODEL }} (${{ env.SOURCE_OS }})"
        body: |
          ## Hi3798MV100 USB 纯净刷机包

          | 项目 | 内容 |
          |------|------|
          | 设备型号 | `${{ env.DEVICE_MODEL }}` |
          | 编译源系统 | `Ubuntu ${{ env.UBUNTU_VERSION }}` |
          | Ubuntu Base 版本 | `${{ env.UBUNTU_VERSION }}` |
          | root 初始密码 | `${{ env.ROOT_PASSWORD }}` |
          | 构建时间 | ${{ github.event.head_commit.timestamp || 'workflow_dispatch' }} |
          | 触发方式 | ${{ github.event_name }} |

          ### 账号信息
          - **用户名：** `root`
          - **初始密码：** `${{ env.ROOT_PASSWORD }}`
          - ⚠️ 首次登录后请立即执行 `passwd root` 修改密码！

          ### 下载与使用
          1. 下载 **Hi3798mv100_USB_${{ env.DEVICE_MODEL }}_${{ env.SOURCE_OS }}.zip**
          2. 解压后将刷机包 zip 解压到 U 盘根目录（FAT32 格式）
          3. U 盘插入机顶盒，按住 Recovery 键通电，等待自动刷机

          ### 总包内文件说明
          | 文件 | 说明 |
          |------|------|
          | USB-hi3798mv100-${{ env.DEVICE_MODEL }}-PURE-${{ env.SOURCE_OS }}-*.zip | 完整刷机包（含 ext4 镜像和引导文件） |
          | usb-rootfs-pure.ext4 | 纯净根文件系统 ext4 镜像（备份） |
          | 刷机包说明.txt | 详细刷机说明文档 |
        files: |
          Hi3798mv100_USB_${{ env.DEVICE_MODEL }}_${{ env.SOURCE_OS }}.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: 12. 清理
      if: always()
      run: |
        sudo rm -rf usb_pure_rootfs temp_mount usb_template USB-hi3798mv100-${{ env.DEVICE_MODEL }}-PURE release_staging 2>/dev/null || true
        rm -f original_usb.zip original_system.ext4 usb-rootfs-pure.ext4 2>/dev/null || true
        echo "✅ 清理完成。"
