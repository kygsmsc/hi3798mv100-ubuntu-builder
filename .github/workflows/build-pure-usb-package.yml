name: 编译Hi3798mv100的ubuntu系统USB刷机包

on:
  workflow_dispatch:
    inputs:
      device_model:
        description: '设备型号（如 mdmo1f）'
        required: false
        default: 'mdmo1f'
      usb_url:
        description: '原始 USB 刷机包下载地址（不填则根据 device_model 自动拼接）'
        required: false
      base_version:
        description: 'Ubuntu Base 版本号（如 20.04.5 / 22.04.5）'
        required: false
        default: '20.04.5'
      base_url:
        description: 'Ubuntu Base 下载目录'
        required: false
        default: 'https://cdimage.ubuntu.com/ubuntu-base/releases/20.04/release'
      mirror:
        description: 'apt 软件源镜像'
        required: false
        default: 'http://repo.huaweicloud.com/ubuntu-ports'
      root_password:
        description: 'root 登录密码（生产环境务必修改）'
        required: false
        default: 'root123'
      p9_size_mb:
        description: 'p9 rootfs ext4 初始大小（MB）。首次启动 resize2fs 自动扩展到整个 p9 分区。原厂约 828MB，默认 1024MB 留冗余'
        required: false
        default: '1024'
  push:
    branches: [ main ]
    paths:
      - 'build_rootfs.sh'
      - 'build_usb_rootfs.sh'
      - 'lib/**'
      - '.github/workflows/**'

concurrency:
  group: build-usb-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-usb-pure:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    env:
      DEVICE_MODEL: ${{ inputs.device_model || 'mdmo1f' }}
      USB_URL: ${{ inputs.usb_url || format('https://node4.histb.com:9088/update/system/mv100-{0}-usb-flash.zip', inputs.device_model || 'mdmo1f') }}
      UBUNTU_VERSION: ${{ inputs.base_version || '20.04.5' }}
      BASE_URL: ${{ inputs.base_url || 'https://cdimage.ubuntu.com/ubuntu-base/releases/20.04/release' }}
      MIRROR: ${{ inputs.mirror || 'http://repo.huaweicloud.com/ubuntu-ports' }}
      ROOT_PASSWORD: ${{ inputs.root_password || 'root123' }}
      P9_SIZE_MB: ${{ inputs.p9_size_mb || '1024' }}

    steps:
    - name: 1. 检出代码
      uses: actions/checkout@v4

    - name: 2. 下载原始 USB 刷机包
      run: |
        wget --no-check-certificate -c --tries=5 --timeout=60 --waitretry=10 "$USB_URL" -O original_usb.zip
        ls -lh original_usb.zip
        unzip -tq original_usb.zip >/dev/null || { echo "❌ 原始包损坏"; exit 1; }
        echo "✅ 原始包完整性 OK"

    - name: 3. 解压并检测原厂 p8 大小
      run: |
        rm -rf usb_template
        mkdir -p usb_template
        unzip -q original_usb.zip -d usb_template/
        ls -la usb_template/mv100/
        test -f "usb_template/mv100/www_ecoo_top.ext4" && echo "✅ 找到 www_ecoo_top.ext4" || { echo "❌ 未找到"; exit 1; }

        cp "usb_template/mv100/www_ecoo_top.ext4" original_p8.sparse
        ls -lh original_p8.sparse

        MAGIC=$(xxd -p -l 4 original_p8.sparse)
        echo "原始镜像 magic: $MAGIC"
        if [ "$MAGIC" != "3aff26ed" ]; then
          echo "❌ 原始 www_ecoo_top.ext4 不是 Android sparse 格式（magic=$MAGIC）"
          exit 1
        fi

        BLK_SZ=$(od -An -tu4 -j12 -N4 original_p8.sparse | tr -d ' ')
        TOTAL_BLKS=$(od -An -tu4 -j16 -N4 original_p8.sparse | tr -d ' ')
        P8_SIZE=$((BLK_SZ * TOTAL_BLKS))
        echo "原厂 p8 raw 大小: $P8_SIZE 字节 ($((P8_SIZE/1024/1024)) MB)"
        echo "P8_SIZE=$P8_SIZE" >> "$GITHUB_ENV"

    - name: 4. 安装依赖
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq qemu-user-static e2fsprogs zip android-sdk-libsparse-utils
        which img2simg

    - name: 5. 缓存 Ubuntu Base 镜像
      uses: actions/cache@v4
      with:
        path: cache/ubuntu-base-*.tar.gz
        key: ubuntu-base-${{ env.UBUNTU_VERSION }}

    - name: 6. 构建纯净根文件系统
      run: |
        chmod +x build_usb_rootfs.sh
        ./build_usb_rootfs.sh

    - name: 7. 构建 p9 rootfs → backup-32.gz → p8 backup 分区 → sparse
      run: |
        # ========== 0. 检查 rootfs 是否放得下 ==========
        ROOTFS_MB=$(sudo du -sm usb_pure_rootfs | cut -f1)
        echo "rootfs 实际大小: ${ROOTFS_MB} MB"
        if [ "$ROOTFS_MB" -gt $((P9_SIZE_MB * 90 / 100)) ]; then
          echo "❌ rootfs (${ROOTFS_MB}MB) 超过 p9 ext4 的 90% (${P9_SIZE_MB}MB)"
          echo "   请增大 p9_size_mb 参数，或精简 rootfs"
          exit 1
        fi
        echo "✅ rootfs (${ROOTFS_MB}MB) 可放入 p9 ext4 (${P9_SIZE_MB}MB)"

        # ========== 1. 创建 p9 rootfs ext4 ==========
        P9_IMG="p9-rootfs.img"
        rm -f "$P9_IMG"
        echo "创建 p9 rootfs ext4 (${P9_SIZE_MB} MB)..."
        dd if=/dev/zero of="$P9_IMG" bs=1M count="$P9_SIZE_MB" status=progress
        mkfs.ext4 -F -m 0 -L "rootfs" "$P9_IMG"

        mkdir -p mnt_p9
        sudo mount -o loop "$P9_IMG" mnt_p9
        sudo cp -a usb_pure_rootfs/. mnt_p9/
        sync
        sudo umount mnt_p9
        e2fsck -p -f "$P9_IMG" || true
        echo "p9 rootfs 最终大小: $(stat -c%s "$P9_IMG") 字节"
        ls -lh "$P9_IMG"

        # ========== 2. gzip -9 压缩为 backup-32.gz ==========
        rm -f backup-32.gz
        echo "压缩为 backup-32.gz (gzip -9)..."
        gzip -9 -c "$P9_IMG" > backup-32.gz
        B32_SIZE=$(stat -c%s backup-32.gz)
        echo "backup-32.gz 大小: $B32_SIZE 字节 ($((B32_SIZE/1024/1024)) MB)"
        ls -lh backup-32.gz

        # p8 ext4 需要预留元数据空间（约 5~10MB）
        P8_MAX=$((P8_SIZE - 10*1024*1024))
        if [ "$B32_SIZE" -ge "$P8_MAX" ]; then
          echo "❌ backup-32.gz ($((B32_SIZE/1024/1024))MB) 超过 p8 可用空间 ($((P8_MAX/1024/1024))MB)"
          echo "   请减小 p9_size_mb 参数，或精简 rootfs 后重试"
          exit 1
        fi
        echo "✅ backup-32.gz ($((B32_SIZE/1024/1024))MB) 可放入 p8 ($((P8_SIZE/1024/1024))MB)"

        # ========== 3. 创建 p8 backup ext4（大小 = 原厂 p8 raw 大小，固定 512MB） ==========
        P8_IMG="p8-backup.img"
        rm -f "$P8_IMG"
        echo "创建 p8 backup ext4 ($P8_SIZE 字节 = $((P8_SIZE/1024/1024)) MB)..."
        dd if=/dev/zero of="$P8_IMG" bs=1 count=0 seek="$P8_SIZE" status=progress
        mkfs.ext4 -F -m 0 -L "backup" "$P8_IMG"

        mkdir -p mnt_p8
        sudo mount -o loop "$P8_IMG" mnt_p8
        sudo cp backup-32.gz mnt_p8/
        sync
        sudo umount mnt_p8
        e2fsck -p -f "$P8_IMG" || true

        P8_ACTUAL=$(stat -c%s "$P8_IMG")
        echo "p8 raw 大小: $P8_ACTUAL 字节 (期望 $P8_SIZE)"
        if [ "$P8_ACTUAL" != "$P8_SIZE" ]; then
          echo "❌ p8 大小不符"
          exit 1
        fi

        # 关键校验：p8 ext4 里确实有 backup-32.gz
        mkdir -p mnt_p8
        sudo mount -o loop "$P8_IMG" mnt_p8
        echo "=== p8 分区内容 ==="
        sudo ls -la mnt_p8/
        if [ ! -f "mnt_p8/backup-32.gz" ]; then
          echo "❌ p8 分区内未找到 backup-32.gz"
          sudo umount mnt_p8
          exit 1
        fi
        echo "✅ p8 分区内 backup-32.gz 存在"
        sudo umount mnt_p8

        # ========== 4. 转 Android sparse ==========
        rm -f www_ecoo_top.img
        img2simg "$P8_IMG" "www_ecoo_top.img"

        SP_BLK_SZ=$(od -An -tu4 -j12 -N4 www_ecoo_top.img | tr -d ' ')
        SP_TOTAL_BLKS=$(od -An -tu4 -j16 -N4 www_ecoo_top.img | tr -d ' ')
        SP_TOTAL_SIZE=$((SP_BLK_SZ * SP_TOTAL_BLKS))
        echo "sparse 头: blk_sz=$SP_BLK_SZ total_blks=$SP_TOTAL_BLKS => $SP_TOTAL_SIZE 字节"
        if [ "$SP_TOTAL_SIZE" != "$P8_SIZE" ]; then
          echo "❌ sparse 解压后大小不符: $SP_TOTAL_SIZE != $P8_SIZE"
          exit 1
        fi
        echo "输出 sparse magic:"
        xxd -l 4 www_ecoo_top.img
        ls -lh www_ecoo_top.img

        # 导出到后续 step
        echo "B32_SIZE=$B32_SIZE" >> "$GITHUB_ENV"
        echo "ROOTFS_MB=$ROOTFS_MB" >> "$GITHUB_ENV"

        # 清理 p9 中间文件
        rm -f "$P9_IMG"

    - name: 8. 替换并重新打包
      run: |
        SOURCE_OS="Ubuntu_${{ env.UBUNTU_VERSION }}"
        echo "编译源系统: ${SOURCE_OS}"

        FINAL_DIR="USB-hi3798mv100-${{ env.DEVICE_MODEL }}-PURE"
        rm -rf "$FINAL_DIR"
        cp -r usb_template "$FINAL_DIR"
        rm -f "$FINAL_DIR/mv100/www_ecoo_top.ext4"
        # 【关键】使用含 backup-32.gz 的 p8 backup 分区 sparse 镜像
        cp www_ecoo_top.img "$FINAL_DIR/mv100/www_ecoo_top.ext4"

        echo "刷机包内容:"
        ls -l "$FINAL_DIR/mv100/"

        INNER_ZIP="USB-hi3798mv100-${{ env.DEVICE_MODEL }}-PURE-${SOURCE_OS}-$(date +%Y%m%d).zip"
        cd "$FINAL_DIR"
        zip -q -r "../${INNER_ZIP}" .
        cd ..
        echo "INNER_ZIP=${INNER_ZIP}" >> "$GITHUB_ENV"
        echo "SOURCE_OS=${SOURCE_OS}" >> "$GITHUB_ENV"
        echo "✅ 最终刷机包:"
        ls -lh "${INNER_ZIP}"

    - name: 9. 打包总包（含说明文档）
      run: |
        RELEASE_ZIP="Hi3798mv100_USB_${{ env.DEVICE_MODEL }}_${SOURCE_OS}.zip"
        mkdir -p release_staging
        cp "${INNER_ZIP}" "release_staging/"
        cp www_ecoo_top.img "release_staging/www_ecoo_top.ext4"

        cat > "release_staging/刷机包说明.txt" << EOF
        ================================================================
          Hi3798MV100 USB 纯净刷机包 — 使用说明
        ================================================================

        【构建信息】
          设备型号：      ${{ env.DEVICE_MODEL }}
          编译源系统：    Ubuntu ${{ env.UBUNTU_VERSION }}
          rootfs 实际：   ${ROOTFS_MB} MB
          p9 ext4 初始：  ${P9_SIZE_MB} MB（首次启动 resize2fs 扩展至分区满）
          p8 分区大小：   $((P8_SIZE/1024/1024)) MB
          backup-32.gz：  $((B32_SIZE/1024/1024)) MB（压缩后）
          构建日期：      $(date '+%Y-%m-%d %H:%M:%S')

        【root 账号信息】
          用户名：        root
          初始密码：      ${{ env.ROOT_PASSWORD }}
          ⚠️ 首次登录后请立即执行 passwd root 修改密码！

        【刷机流程说明】
          fastboot 刷写 p1~p6（boot/kernel 等）
          fastboot 刷写 p7（recoverybox32.ext4）
          fastboot 刷写 p8（www_ecoo_top.ext4，内含 backup-32.gz）
          重启进入 p7 → 自动解压 backup-32.gz 写入 p9
          再次重启 → 进入 p9 新系统 → resize2fs 扩展分区

        【刷机步骤】
          1. 将刷机包 zip 解压到 U 盘根目录（U 盘须为 FAT32 格式）
          2. 将 U 盘插入机顶盒 USB 口
          3. 按住机身侧面 Recovery 按钮，接通电源
          4. 等待进入刷机界面后松开按钮，自动开始刷机
          5. 首次启动较慢（解压 + 扩展分区），请耐心等待

        【注意事项】
          - 刷机前请确认设备型号与本包匹配，刷错型号可能导致变砖
          - U 盘建议使用 USB 2.0 接口
          - root 初始密码为：${{ env.ROOT_PASSWORD }}
        ================================================================
        EOF
        sed -i 's/^        //' "release_staging/刷机包说明.txt"

        cd release_staging
        zip -q -r "../${RELEASE_ZIP}" .
        cd ..
        echo "RELEASE_ZIP=${RELEASE_ZIP}" >> "$GITHUB_ENV"
        echo "✅ 总包:"
        ls -lh "${RELEASE_ZIP}"

    - name: 10. 上传 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Hi3798mv100_USB_${{ env.DEVICE_MODEL }}_${{ env.SOURCE_OS }}
        path: |
          Hi3798mv100_USB_${{ env.DEVICE_MODEL }}_${{ env.SOURCE_OS }}.zip
        retention-days: 7
        if-no-files-found: error

    - name: 11. 上传到 GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ github.run_number }}-${{ env.DEVICE_MODEL }}
        name: "Hi3798MV100 USB 纯净刷机包 - ${{ env.DEVICE_MODEL }} (${{ env.SOURCE_OS }})"
        body: |
          ## Hi3798MV100 USB 纯净刷机包

          | 项目 | 内容 |
          |------|------|
          | 设备型号 | `${{ env.DEVICE_MODEL }}` |
          | 编译源系统 | `Ubuntu ${{ env.UBUNTU_VERSION }}` |
          | rootfs 实际 | `${ROOTFS_MB} MB` |
          | p9 ext4 初始 | `${P9_SIZE_MB} MB`（首次启动扩展至分区满） |
          | p8 分区 | `$((P8_SIZE/1024/1024)) MB` |
          | backup-32.gz | `$((B32_SIZE/1024/1024)) MB` |

          ### 账号信息
          - **用户名：** `root`
          - **初始密码：** `${{ env.ROOT_PASSWORD }}`
          - ⚠️ 首次登录后请立即执行 `passwd root` 修改密码！

          ### 下载与使用
          1. 下载 **Hi3798mv100_USB_${{ env.DEVICE_MODEL }}_${{ env.SOURCE_OS }}.zip**
          2. 解压后将刷机包 zip 解压到 U 盘根目录（FAT32 格式）
          3. U 盘插入机顶盒，按住 Recovery 键通电，等待自动刷机
        files: |
          Hi3798mv100_USB_${{ env.DEVICE_MODEL }}_${{ env.SOURCE_OS }}.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: 12. 清理
      if: always()
      run: |
        sudo rm -rf usb_pure_rootfs temp_mount usb_template USB-hi3798mv100-${{ env.DEVICE_MODEL }}-PURE release_staging mnt_p8 mnt_p9 2>/dev/null || true
        rm -f original_usb.zip original_p8.sparse p9-rootfs.img p8-backup.img backup-32.gz www_ecoo_top.img 2>/dev/null || true
        echo "✅ 清理完成。"
